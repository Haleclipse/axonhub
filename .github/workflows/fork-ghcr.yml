# Fork-only image publishing: builds this fork natively on amd64 and arm64
# runners and publishes a multi-arch image to GHCR with the workflow token.
# Upstream publishing to Docker Hub stays in docker-publish.yml and
# docker-unstable.yml; this workflow never runs outside the fork.
#
# Tags:
#   ghcr.io/haleclipse/axonhub:sha-<short sha>   immutable, use for deployments
#   ghcr.io/haleclipse/axonhub:<branch>          moves with the branch head

name: Publish fork image (GHCR)

on:
  push:
    branches:
      - feat/commandcodes-channel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/haleclipse/axonhub

jobs:
  prepare:
    name: Resolve version & tags
    if: github.repository == 'Haleclipse/axonhub'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      ref_tag: ${{ steps.resolve.outputs.ref_tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve version & tags
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --force --depth=1 origin || true
          BASE_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(cat internal/build/VERSION 2>/dev/null || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # Docker tags allow [A-Za-z0-9_.-]; branch slashes become dashes.
          REF_TAG=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')
          {
            printf 'version=%s-fork.%s.%s\n' "$BASE_VERSION" "$(date +%Y%m%d)" "$SHORT_SHA"
            printf 'short_sha=%s\n' "$SHORT_SHA"
            printf 'ref_tag=%s\n' "$REF_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Write VERSION
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$VERSION" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=fork-ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

  manifest:
    name: Create multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          REF_TAG: ${{ needs.prepare.outputs.ref_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            -t "${IMAGE}:${REF_TAG}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}" --format '{{.Manifest.Digest}}')
          {
            echo "### Published"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Tags: \`${IMAGE}:sha-${SHORT_SHA}\`, \`${IMAGE}:${REF_TAG}\`"
            echo "- Digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
